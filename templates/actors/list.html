{% extends "base.html" %}
{% block title %}Actors{% endblock %}
{% block content %}
	<h3>Actors</h3>
	<a href="{{ url_for('actors.add_actor_form') }}">ADD</a>
      <br>
      <table style="border-spacing: 30px;">
         <thead style="padding:15px">
            <th>Id</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Last Update</th>
            <th>#</th>
         </thead>
         {% for data in actors %}
         <tbody style="padding-right:15px">
            <td>{{data.actor_id}}</td>
            <td>{{data.first_name}}</td>
            <td>{{data.last_name}}</td>
            <td>{{data.last_update}}</td>
            <td>
               <form action="{{ url_for('actors.delete_actor', id=data.actor_id) }}" method="POST"
                     onsubmit='return confirm({{ ("Delete " ~ data.first_name ~ " " ~ data.last_name ~ "?")|tojson }});'>
                  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                  <button type="submit">Delete</button>
               </form>
            </td>
         </tbody>
         {% endfor%}
      </table>
{% endblock %}
