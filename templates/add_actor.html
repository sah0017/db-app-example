<!DOCTYPE html>
<html>
<head>
	<title>Add Actor</title>
</head>
<body>
	<h3>Actor form</h3>
	{% for message in get_flashed_messages() %}
	<p style="color: red;">{{ message }}</p>
	{% endfor %}
	<form action="/add" method="POST">
		<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
		<label>First Name</label>
		<input type="text" name="first_name" placeholder="first name..." required maxlength="{{ max_name_length }}">
		<label>Last Name</label>
		<input type="text" name= "last_name" placeholder="last name..." required maxlength="{{ max_name_length }}">
		<button type="submit">Add</button>
	</form>
</body>
</html>
